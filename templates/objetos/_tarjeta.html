<article class="tarjeta">
    <div class="tarjeta__imagen">{{ objeto.icono }}</div>
    <div class="tarjeta__cuerpo">
        <span class="insignia insignia--{{ objeto.tipo }}">
            {% if objeto.tipo == 'perdido' %}Perdido{% else %}Encontrado{% endif %}
        </span>
        <h3 class="tarjeta__titulo">{{ objeto.titulo }}</h3>
        <p class="tarjeta__dato">Lugar: {{ objeto.lugar }}</p>
        <p class="tarjeta__dato">Fecha: {{ objeto.fecha }}</p>
        <a href="{% url 'objetos:detalle' objeto.id %}" class="boton boton--primario boton--chico">Ver más</a>
    </div>
</article>
