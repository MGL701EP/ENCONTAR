{% extends 'base.html' %}

{% block titulo %}Reportar objeto{% endblock %}

{% block contenido %}
<div class="contenedor principal--con-margen">
    <div class="formulario-caja">
        <h1>Reportar un objeto</h1>
        <p class="subtitulo">Completa los datos. No incluyas tu número de celular: la plataforma se encarga del contacto.</p>

        <form method="post" class="formulario" enctype="multipart/form-data">
            {% csrf_token %}

            <fieldset class="selector-tipo">
                <legend>¿Qué quieres reportar?</legend>
                <label class="opcion">
                    <input type="radio" name="tipo" value="perdido" {% if tipo_inicial != 'encontrado' %}checked{% endif %}>
                    <span>Perdí algo</span>
                </label>
                <label class="opcion">
                    <input type="radio" name="tipo" value="encontrado" {% if tipo_inicial == 'encontrado' %}checked{% endif %}>
                    <span>Encontré algo</span>
                </label>
            </fieldset>

            <label class="grupo">
                <span>Nombre del objeto *</span>
                <input type="text" name="titulo" class="campo" placeholder="Ej.: Audífonos blancos con estuche" required maxlength="100">
            </label>

            <div class="fila">
                <label class="grupo">
                    <span>Categoría *</span>
                    <select name="categoria" class="campo" required>
                        <option value="">Selecciona…</option>
                        {% for clave, nombre in categorias %}
                            <option value="{{ clave }}">{{ nombre }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label class="grupo">
                    <span>Fecha *</span>
                    <input type="date" name="fecha" class="campo" required>
                </label>
            </div>

            <label class="grupo">
                <span>Lugar *</span>
                <select name="lugar" class="campo" required>
                    <option value="">Selecciona…</option>
                    {% for lugar in lugares %}
                        <option value="{{ lugar }}">{{ lugar }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="grupo" data-solo-encontrado>
                <span>¿Dónde lo dejaste?</span>
                <select name="punto_entrega" class="campo">
                    {% for punto in puntos_entrega %}
                        <option value="{{ punto }}">{{ punto }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="grupo">
                <span>Descripción</span>
                <textarea name="descripcion" class="campo" rows="4" placeholder="Color, marca, detalles que ayuden a reconocerlo"></textarea>
            </label>

            <label class="grupo">
                <span>Foto (opcional)</span>
                <input type="file" name="foto" class="campo" accept="image/*">
            </label>

            <div class="formulario__acciones">
                <a href="{% url 'objetos:lista' %}" class="boton boton--texto">Cancelar</a>
                <button type="submit" class="boton boton--primario">Publicar reporte</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
